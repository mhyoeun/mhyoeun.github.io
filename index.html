<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f3f1ed" />
  <title>LUNA / NOX</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Libre+Caslon+Display&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="noise" aria-hidden="true"></div>

  <header class="topbar">
    <a class="brand" href="#home" aria-label="홈으로">LUNA / NOX</a>
    <nav class="top-actions" aria-label="사이트 도구">
      <button class="text-btn" id="themeToggle">NIGHT</button>
      <button class="text-btn" id="layoutReset">RESET</button>
      <button class="text-btn accent" id="aboutOpen">ABOUT</button>
    </nav>
  </header>

  <main class="desktop" id="desktop">
    <section class="hero-copy">
      <p class="eyebrow">ARCHIVE 01 · TWO DIVINITIES</p>
      <h1>between<br><em>dusk</em> &amp; night</h1>
      <p class="hero-note">루나와 녹스의 기록. 창을 끌어 움직이고, 카드를 눌러 프로필을 열어보세요.</p>
    </section>

    <article class="float-window character-window" data-window="luna" style="--x: 51%; --y: 16%; --rot: -1.3deg;">
      <div class="window-bar drag-handle">
        <span>LUNA.profile</span>
        <span class="window-mark">01</span>
      </div>
      <button class="character-card" data-character="luna" aria-label="루나 프로필 열기">
        <div class="portrait portrait-luna">
          <span class="portrait-placeholder">LUNA<br>IMAGE</span>
        </div>
        <div class="card-meta">
          <div>
            <small>DIVINITY · 01.01</small>
            <strong>LUNA</strong>
          </div>
          <span class="arrow">↗</span>
        </div>
      </button>
    </article>

    <article class="float-window character-window" data-window="nox" style="--x: 69%; --y: 42%; --rot: 1.2deg;">
      <div class="window-bar drag-handle">
        <span>NOX.profile</span>
        <span class="window-mark">02</span>
      </div>
      <button class="character-card" data-character="nox" aria-label="녹스 프로필 열기">
        <div class="portrait portrait-nox">
          <span class="portrait-placeholder">NOX<br>IMAGE</span>
        </div>
        <div class="card-meta">
          <div>
            <small>DIVINITY · 12.31</small>
            <strong>NOX</strong>
          </div>
          <span class="arrow">↗</span>
        </div>
      </button>
    </article>

    <article class="float-window memo-window" data-window="memo" style="--x: 8%; --y: 59%; --rot: -0.5deg;">
      <div class="window-bar drag-handle">
        <span>memo.txt</span>
        <span class="window-mark">✦</span>
      </div>
      <div class="memo-body">
        <p>“둘의 만남에서 시작해, 함께 걷는 시간이 메인 파트.”</p>
        <div class="memo-tags"><span>#character</span><span>#pair</span><span>#world</span></div>
      </div>
    </article>

    <article class="float-window index-window" data-window="index" style="--x: 7%; --y: 26%; --rot: 0.3deg;">
      <div class="window-bar drag-handle">
        <span>INDEX</span>
        <span class="window-mark">04</span>
      </div>
      <nav class="index-list">
        <button data-open="characters"><span>01</span>CHARACTERS</button>
        <button data-open="story"><span>02</span>STORY</button>
        <button data-open="world"><span>03</span>WORLD</button>
        <button data-open="gallery"><span>04</span>GALLERY</button>
      </nav>
    </article>
  </main>

  <aside class="music-player" id="musicPlayer">
    <div class="music-head drag-handle">
      <span>NOW PLAYING</span><span>♫</span>
    </div>
    <div class="music-body">
      <div class="disc" id="disc"></div>
      <div class="track-info">
        <strong id="trackTitle">Nocturne</strong>
        <span id="trackArtist">LUNA / NOX</span>
      </div>
      <button class="round-btn" id="playBtn" aria-label="재생">▶</button>
    </div>
    <div class="progress"><span></span></div>
  </aside>

  <dialog class="profile-modal" id="profileModal">
    <button class="modal-close" id="modalClose" aria-label="닫기">×</button>
    <div class="modal-grid">
      <div class="modal-visual" id="modalVisual"></div>
      <div class="modal-copy">
        <p class="modal-kicker" id="modalKicker"></p>
        <h2 id="modalName"></h2>
        <p class="modal-en" id="modalEn"></p>
        <div class="modal-tabs" role="tablist">
          <button class="is-active" data-tab="profile">PROFILE</button>
          <button data-tab="story">STORY</button>
          <button data-tab="relation">RELATION</button>
        </div>
        <div class="modal-content" id="modalContent"></div>
      </div>
    </div>
  </dialog>

  <dialog class="simple-modal" id="simpleModal">
    <button class="modal-close" id="simpleClose" aria-label="닫기">×</button>
    <p class="modal-kicker" id="simpleKicker"></p>
    <h2 id="simpleTitle"></h2>
    <div class="simple-content" id="simpleContent"></div>
  </dialog>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
